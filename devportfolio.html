<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elkanah's Portfolio</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;700&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/fontawesome.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/brands.min.css">
    <style>
        :root {
            --primary: #4A90E2;
            --secondary: #6C5CE7;
            --bg: #F8F9FA;
            --text: #2D3436;
            --nav-bg: rgba(248, 249, 250, 0.95);
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .dark-theme {
            --bg: #2D3436;
            --text: #F8F9FA;
            --nav-bg: rgba(45, 52, 54, 0.95);
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        body {
            /* Typography */
            font-family: 'Cormorant Garamond', serif;
            color: var(--text);
            line-height: 1.7;

            /* Layout */
            background: var(--bg);
        /* Navigation: Styles for the fixed navigation bar at the top of the page, including layout, hover effects, and responsiveness */
        }

        /* Navigation */
        nav {
            padding: 1rem 5%;
            position: fixed;
            width: 100%;
            background: var(--nav-bg);
            backdrop-filter: blur(10px);
            box-shadow: var(--shadow);
            z-index: 1000;
        }

        .nav-items {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
        }

        .nav-items a {
            margin: 0 1.5rem;
            text-decoration: none;
            color: var(--text);
            font-weight: 500;
            position: relative;
        }

        .nav-items a::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--primary);
            transition: width 0.3s;
        }

        .nav-items a:hover::after {
            width: 100%;
        }

        /* Hero Section */
        #hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            padding: 8rem 5% 4rem;
            text-align: center;
        }

        .profile-img {
            width: 220px;
            height: 220px;
            border-radius: 50%;
            margin-bottom: 2rem;
            border: 4px solid var(--primary);
            box-shadow: var(--shadow);
            object-fit: cover;
        }

        .hero-content h1 {
            font-size: 3.5rem;
            margin-bottom: 1rem;
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .socials a {
            color: var(--text);
            margin: 0 1rem;
            font-size: 1.8rem;
            transition: transform 0.3s;
        }

        .socials a:hover {
            transform: translateY(-3px);
        }

        /* Sections */
        section {
            padding: 6rem 5%;
            scroll-margin-top: 4rem;
        }

        /* Fade-in animation */
        .fade-in {
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.6s ease;
        }

        h2 {
            font-size: 2.5rem;
            margin-bottom: 3rem;
            text-align: center;
            position: relative;
        }

        h2::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 3px;
            background: var(--primary);
        }

        /* Skills */
        .skill-container {
            max-width: 800px;
            margin: 0 auto;
        }

        .skill-bar {
            margin: 1.5rem 0;
        }

        .skill-progress {
            height: 20px;
            background: var(--primary);
            border-radius: 10px;
            position: relative;
            overflow: hidden;
        }

        .skill-progress::after {
            content: attr(data-width);
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            color: white;
            font-size: 0.9rem;
        }

        /* Projects */
        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .project-card {
            background: var(--nav-bg);
            border-radius: 15px;
            padding: 2rem;
            box-shadow: var(--shadow);
            transition: transform 0.3s;
        }

        .project-card:hover {
            transform: translateY(-10px);
        }

        /* Contact Form */
        .contact-form {
            max-width: 600px;
            margin: 0 auto;
        }

        input, textarea {
            width: 100%;
            padding: 1rem;
            margin: 0.5rem 0;
            border: 2px solid #ddd;
            border-radius: 8px;
            background: var(--nav-bg);
            color: var(--text);
            transition: border-color 0.3s;
        }

        input:focus, textarea:focus {
            border-color: var(--primary);
            outline: none;
        }

        button {
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            color: white;
            padding: 1rem 2rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            letter-spacing: 1px;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(106, 90, 234, 0.3);
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .nav-items {
                flex-direction: column;
                gap: 1rem;
                text-align: center;
            }

            #hero {
                padding-top: 10rem;
            }

            .profile-img {
                width: 180px;
                height: 180px;
            }

            h2 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <!-- Navigation remains same -->

    <section id="hero">
            <img src="https://via.placeholder.com/220" alt="Profile" class="profile-img">
            <img src="YOUR_IMAGE_URL_HERE" alt="Profile" class="profile-img">
            <h1>Cheruiyot Elkanah</h1>
            <p>Full Stack Developer & UI Enthusiast</p>
            <div class="socials">
    <script>
    // Smooth scrolling for anchor links
    document.querySelectorAll('a[href^="#"]').forEach(anchor => {
        anchor.addEventListener('click', function (e) {
            e.preventDefault();
            const targetElement = document.querySelector(this.getAttribute('href'));
            if (targetElement) {
                targetElement.scrollIntoView({
                    behavior: 'smooth'
                });
            }
        });
    });

    // Add intersection observer for fade-in animations
    const observer = new IntersectionObserver((entries, observer) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                entry.target.style.opacity = 1;
                entry.target.style.transform = 'translateY(0)';
                observer.unobserve(entry.target); // Unobserve after animation
            }
        });
    });
    document.querySelectorAll('section').forEach(section => {
        section.classList.add('fade-in');
        observer.observe(section);
    });
    </script>
        });
        });
    </script>
</body>
</html>
