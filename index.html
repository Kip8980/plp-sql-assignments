<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dev Portfolio</title>
    <!-- Fonts -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #4470df;
            --bg: #cde7ea;
            --text: #08060ff9;
            --nav-bg: rgba(97, 203, 208, 0.9);
        }

        .dark-theme {
            --bg: #1561a7;
            --text: #fff;
            --nav-bg: rgba(44, 62, 80, 0.9);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            transition: background 0.3s, color 0.3s;
        }

        body {
            font-family: 'Cormorant Garamond', serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
        }

        /* Navigation */
        nav {
            padding: 1rem 5%;
            position: relative;
            width: 100%;
            background: var(--nav-bg);
            z-index: 100;
        }

        .nav-items {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-items a {
            margin: 0 1rem;
            text-decoration: none;
            color: var(--text);
        }

        /* Hero Section */
        #hero {
            height: 100vh;
            display: flex;
            align-items: center;
            padding: 0 5%;
            padding-top: 4rem;
        }

        .hero-content {
            max-width: 600px;
        }

        .profile-img {
            width: 200px;
            border-radius: 50%;
            margin-bottom: 1rem;
        }

        .socials a {
            color: var(--text);
            margin-right: 1rem;
            font-size: 1.5rem;
        }

        /* Skills Section */
        .skill-bar {
            width: 100%;
            height: 20px;
            background: #eee;
            border-radius: 10px;
            margin: 1rem 0;
            color: black;
        }

        .skill-progress {
            height: 100%;
            background: var(--primary);
            border-radius: 10px;
            width: 0;
            transition: width 2s ease-in-out;
        }

        /* Projects Grid */
        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
            padding: 2rem 5%;
        }

        .project-card {
            border: 1px solid #ddd;
            padding: 1.5rem;
            border-radius: 10px;
        }

        /* Contact Form */
        #contact {
            padding: 4rem 5%;
        }

        .contact-form {
            max-width: 600px;
            margin: 0 auto;
        }

        input, textarea {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-family: inherit;
        }

        button {
            background: var(--primary);
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-family: inherit;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .nav-items {
                flex-direction: column;
                gap: 1rem;
            }
            
            #hero {
                flex-direction: column;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <nav>
        <div class="nav-items">
            <h1>DevPort</h1>
            <div>
                <a href="#hero">Home</a>
                <a href="#about">About</a>
                <a href="#projects">Projects</a>
                <a href="#contact">Contact</a>
                <button id="themeToggle">🌓</button>
            </div>
        </div>
    </nav>

    <section id="hero">
        <div class="hero-content">
            <img src="C:\Users\PC\Downloads\Flux_Dev_1_Logo_ConceptsMinimalist_Logo_A_sleek_modern_logo_fo_1.jpeg" alt="Profile" class="profile-img">
            <h1>Cheruiyot Elkanah</h1>
            <p>Full Stack Developer</p>
            <div class="socials">
                <a href="#"><i class="fab fa-github"></i></a>
                <a href="#"><i class="fab fa-linkedin"></i></a>
            </div>
        </div>
    </section>

    <section id="about">
        <h2>Skills</h2>
        <div class="skill-bar">
            <div class="skill-progress" data-width="90%">HTML/CSS</div>
        </div>
        <div class="skill-bar">
            <div class="skill-progress" data-width="80%">JavaScript</div>
        </div>
    </section>

    <section id="projects">
        <h2>Projects</h2>
        <div class="projects-grid">
            <div class="project-card">
                <h3>Project 1</h3>
                <p>E-commerce Platform</p>
            </div>
            <div class="project-card">
                <h3>Project 2</h3>
                <p>Social Media App</p>
            </div>
        </div>
    </section>

    <section id="contact">
        <h2>Contact Me</h2>
        <form class="contact-form" id="contactForm">
            <input type="text" placeholder="Name" id="name" required>
            <input type="email" placeholder="Email" id="email" required>
            <textarea placeholder="Message" id="message" rows="5" required></textarea>
            <button type="submit">Send Message</button>
        </form>
    </section>

    <!-- Firebase Scripts (deferred for performance) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js" defer></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js" defer></script>
    
    <script>
        // Theme Toggler
        document.getElementById('themeToggle').addEventListener('click', () => {
            document.body.classList.toggle('dark-theme');
        });

        // Skill Animation
        window.addEventListener('scroll', () => {
            document.querySelectorAll('.skill-progress').forEach(progress => {
                const rect = progress.getBoundingClientRect();
                if (rect.top < window.innerHeight) {
                    progress.style.width = progress.dataset.width;
                }
            });
        });

        // Initialize Firebase (replace with your config)
        document.addEventListener('DOMContentLoaded', () => {
            const firebaseConfig = {
                apiKey: "YOUR_API_KEY",
                authDomain: "YOUR_AUTH_DOMAIN",
                databaseURL: "YOUR_DB_URL",
                projectId: "YOUR_PROJECT_ID",
                storageBucket: "YOUR_STORAGE_BUCKET",
                messagingSenderId: "YOUR_SENDER_ID",
                appId: "YOUR_APP_ID"
            };
            
            firebase.initializeApp(firebaseConfig);
            const database = firebase.database();

            // Contact Form Handler
            document.getElementById('contactForm').addEventListener('submit', (e) => {
                e.preventDefault();
                
                const name = document.getElementById('name').value;
                const email = document.getElementById('email').value;
                const message = document.getElementById('message').value;

                database.ref('contacts').push().set({
                    name, email, message, timestamp: Date.now()
                })
                .then(() => {
                    alert('Message sent!');
                    e.target.reset();
                })
                .catch(console.error);
            });
        });
    </script>
</body>
</html>
