<p>Paragraph 1</p>
<p>Paragraph 2</p>
<button id="changeButton">Change Paragraphs</button>

<style>
  /* Adding smooth transition for text color */
  p {
    transition: color 0.5s ease;
  }

  /* Adding some initial colors */
  .original {
    color: black;
  }
  .new {
    color: blue;
  }
</style>

<script>
  // Get the paragraphs and the button
  const paragraphs = document.getElementsByTagName("p");
  const button = document.getElementById("changeButton");

  // Track whether the paragraphs have been changed or not
  let isChanged = false;

  // Initial colors for the paragraphs
  paragraphs[0].classList.add('original');
  paragraphs[1].classList.add('original');

  // When the button is clicked, toggle the text and styles of the paragraphs
  button.addEventListener("click", function() {
    if (isChanged) {
      // Change the paragraphs back to their original text
      paragraphs[0].textContent = "Paragraph 1";
      paragraphs[1].textContent = "Paragraph 2";
      // Set the color back to original (black)
      paragraphs[0].classList.remove('new');
      paragraphs[1].classList.remove('new');
      paragraphs[0].classList.add('original');
      paragraphs[1].classList.add('original');
    } else {
      // Change the paragraphs to new text
      paragraphs[0].textContent = "New text for Paragraph 1!";
      paragraphs[1].textContent = "New text for Paragraph 2!";
      // Change color to blue (new text color)
      paragraphs[0].classList.remove('original');
      paragraphs[1].classList.remove('original');
      paragraphs[0].classList.add('new');
      paragraphs[1].classList.add('new');
    }

    // Toggle the isChanged flag
    isChanged = !isChanged;
  });
</script>
